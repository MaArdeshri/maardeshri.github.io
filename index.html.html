<section id="fixed-dfig-v13" aria-label="Portfolio hero with mechanically connected wind turbine and detailed converters">
  <header class="fd-nav"><div class="fd-brand">Masoud <span>Ardeshiri</span></div><nav class="fd-links" aria-label="Portfolio sections"><span>Experience</span><span>Expertise</span><span>Education</span><span>Contact</span></nav></header>

  <svg class="fd-scene" viewBox="0 0 1440 608" role="img" aria-labelledby="fd-title fd-desc">
    <title id="fd-title">Wind rotor rigidly connected to a DFIG shaft and detailed power converters</title>
    <desc id="fd-desc">The blade roots, hub, bearing and shaft share one exact center. The wind turbine, tower and DFIG are positioned left of the converters. The animated power-flow dots are smaller. The ESS half-bridge is enclosed in a rectangular converter frame matching the RSC and LSC. The battery uses the supplied visual style with a grey cap, orange body, plus sign, lightning symbol and minus sign.</desc>
    <defs>
      <linearGradient id="fd-air" x1="0" x2="1"><stop stop-color="#197c9a" stop-opacity="0"/><stop offset="1" stop-color="#197c9a"/></linearGradient>
      <linearGradient id="fd-energy" x1="0" x2="1"><stop stop-color="#0796a2"/><stop offset="1" stop-color="#256caa"/></linearGradient>
      <filter id="fd-glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
      <g id="fd-switch" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path d="M10 0v7M10 21v7M5 8v12M10 7L6 11M6 17l4 4M0 14h5" stroke="#010609" stroke-width="2.2"/>
        <path d="M17 6v16M13 10l4-4 4 4zM13 18h8M10 4h7v2M10 24h7v-2" stroke="#010609" stroke-width="2.2"/>
      </g>
    </defs>

    <!-- Animated wind approaches the blade plane from the left. -->
    <g fill="none" stroke="url(#fd-air)" stroke-width="2" stroke-linecap="round" opacity=".58">
      <path class="fd-wind" d="M300 78C370 67 448 73 525 91"/>
      <path class="fd-wind b" d="M275 139C360 122 447 132 538 152"/>
      <path class="fd-wind" d="M282 205C365 190 452 196 542 209"/>
      <path class="fd-wind b" d="M305 278C377 258 452 263 527 280"/>
    </g>

    <!-- The complete technical structure is shifted toward the center and upward. -->
    <g transform="translate(-105 -22)">
    <!-- Turbine, tower and DFIG are moved left of the converter chain. -->
    <g transform="translate(-145 0)">
    <!-- One rigid mechanical axis: hub center = bearing center = shaft center = generator-rotor center. -->
    <g stroke-linecap="round" stroke-linejoin="round">
      <!-- Fixed tower and nacelle -->
      <path d="M882 233L857 531H912Z" fill="rgba(255,255,255,.30)" stroke="#78acb5" stroke-width="4"/>
      <path d="M796 175H982C999 175 1010 188 1010 205s-11 30-28 30H796Z" fill="rgba(255,255,255,.38)" stroke="#79aab5" stroke-width="3"/>

      <!-- Fixed outer bearing and the shaft visibly entering the generator -->
      <circle cx="810" cy="205" r="30" fill="#092b40" stroke="#72a4b1" stroke-width="4"/>
      <path d="M810 205H938" fill="none" stroke="#c0eee6" stroke-width="8"/>
      <path d="M810 205H938" fill="none" stroke="#244d61" stroke-width="3"/>
      <circle cx="857" cy="205" r="12" fill="#0b3047" stroke="#87c6c4" stroke-width="3"/>
      

      <!-- All three blade roots and both hub circles are inside this one rotating group. -->
      <g class="fd-rotor">
        <g fill="rgba(112,224,207,.18)" stroke="#147d89" stroke-width="3">
          <path d="M810 190C819 144 827 88 813 44C801 31 789 49 790 65C792 114 798 156 810 190Z"/>
          <path d="M810 190C819 144 827 88 813 44C801 31 789 49 790 65C792 114 798 156 810 190Z" transform="rotate(120 810 205)"/>
          <path d="M810 190C819 144 827 88 813 44C801 31 789 49 790 65C792 114 798 156 810 190Z" transform="rotate(240 810 205)"/>
        </g>
        <circle cx="810" cy="205" r="23" fill="#0a2d43" stroke="#08798a" stroke-width="4"/>
        <circle cx="810" cy="205" r="10" fill="#08798a"/>
        <circle cx="810" cy="205" r="4" fill="#123b52"/>
        <g fill="#08798a"><circle cx="810" cy="188" r="2.5"/><circle cx="795" cy="214" r="2.5"/><circle cx="825" cy="214" r="2.5"/></g>
      </g>

      <!-- Fixed DFIG stator and rotating internal circle on the same horizontal shaft axis -->
      <circle cx="938" cy="205" r="38" fill="rgba(120,234,215,.08)" stroke="#679aa8" stroke-width="3"/>
      <circle cx="938" cy="205" r="29" fill="#092c42" stroke="#8ac6c6" stroke-width="3"/>
      <g class="fd-genrotor" fill="none" stroke="#08798a" stroke-width="2.5">
        <circle cx="938" cy="205" r="18"/><path d="M938 187v10M938 213v10M920 205h10M946 205h10"/><circle cx="938" cy="205" r="6" fill="#08798a" stroke="none"/>
      </g>
      
    </g>
    </g>

    <!-- DFIG stator is connected directly to the three-phase PCC / load bus. -->
    <g fill="none" stroke="#315f78" stroke-width="1.8">
      <path d="M831 190H1320"/>
      <path d="M831 205H1320"/>
      <path d="M831 220H1320"/>
    </g>
    <g fill="none" stroke="url(#fd-energy)" stroke-width="2.6" filter="url(#fd-glow)">
      <path class="fd-flow" d="M831 190H1320"/>
      <path class="fd-flow phase-b" d="M831 205H1320"/>
      <path class="fd-flow phase-c" d="M831 220H1320"/>
    </g>
    
    <g transform="translate(1320 165)">
      <rect width="105" height="80" rx="8" fill="rgba(255,255,255,.42)" stroke="#071b25" stroke-width="2"/>
      <!-- Grid tower and AC-load waveform icon; no phase lines continue inside the frame. -->
      <g fill="none" stroke="#071b25" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M31 12L19 53H43Z M24 34H38 M22 43H40 M31 12V53 M24 24H38"/>
        <path d="M53 35h7c3-10 6 10 9 0s6 10 9 0 6 10 9 0"/>
      </g>
      
    </g>

    <!-- Three-phase pickup is taken from the rotating DFIG rotor, drops vertically, then turns 90 degrees into the RSC. -->
    <g fill="none" stroke="#315f78" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M785 223V392H864"/>
      <path d="M793 223V406H864"/>
      <path d="M801 223V420H864"/>
    </g>
    <g fill="none" stroke="url(#fd-energy)" stroke-width="2.6" filter="url(#fd-glow)">
      <path class="fd-flow" d="M785 223V392H864"/>
      <path class="fd-flow phase-b" d="M793 223V406H864"/>
      <path class="fd-flow phase-c" d="M801 223V420H864"/>
    </g>
    <!-- Slip-ring pickup points on the rotating rotor and phase terminals at the RSC. -->
    <g fill="#08798a" stroke="#071b25" stroke-width="1.2">
      <circle cx="785" cy="223" r="4"/><circle cx="793" cy="223" r="4"/><circle cx="801" cy="223" r="4"/>
      <circle cx="864" cy="392" r="3.2"/><circle cx="864" cy="406" r="3.2"/><circle cx="864" cy="420" r="3.2"/>
    </g>
    
    

    <!-- RSC, common DC link and LSC: each bridge shows six IGBT/diode switch cells. -->
    <g transform="translate(784 350)" font-family="Inter, sans-serif">
      
      <g transform="translate(80 0)">
        <rect width="150" height="126" rx="8" fill="rgba(255,255,255,.48)" stroke="#6f9daa" stroke-width="2"/>
        
        <path d="M18 16H132M18 110H132" fill="none" stroke="#81b7bf" stroke-width="2"/>
        <g transform="translate(29 18)"><use href="#fd-switch"/><use href="#fd-switch" y="48"/></g><g transform="translate(69 18)"><use href="#fd-switch"/><use href="#fd-switch" y="48"/></g><g transform="translate(109 18)"><use href="#fd-switch"/><use href="#fd-switch" y="48"/></g>
        <g fill="none" stroke="#071b25" stroke-width="1.7"><path d="M39 16v2M39 46v20M39 94v16M79 16v2M79 46v20M79 94v16M119 16v2M119 46v20M119 94v16"/></g>
        <g fill="#08798a" font-size="8"></g>
        <g fill="#748fa2" font-size="6"></g>
      </g>

      <path d="M230 16H324M230 110H324" fill="none" stroke="#83b3be" stroke-width="2"/><path class="fd-flow" d="M230 16H324M324 110H230" fill="none" stroke="#86eadb" stroke-width="2.7"/>
      <path d="M267 16V59M255 59h24M255 67h24M267 67V110" fill="none" stroke="#08798a" stroke-width="2.4"/>

      <g transform="translate(324 0)">
        <rect width="150" height="126" rx="8" fill="rgba(255,255,255,.48)" stroke="#6f9daa" stroke-width="2"/>
        
        <path d="M18 16H132M18 110H132" fill="none" stroke="#81b7bf" stroke-width="2"/>
        <g transform="translate(29 18)"><use href="#fd-switch"/><use href="#fd-switch" y="48"/></g><g transform="translate(69 18)"><use href="#fd-switch"/><use href="#fd-switch" y="48"/></g><g transform="translate(109 18)"><use href="#fd-switch"/><use href="#fd-switch" y="48"/></g>
        <g fill="none" stroke="#071b25" stroke-width="1.7"><path d="M39 16v2M39 46v20M39 94v16M79 16v2M79 46v20M79 94v16M119 16v2M119 46v20M119 94v16"/></g>
        <g fill="#08798a" font-size="8"></g>
        <g fill="#748fa2" font-size="6"></g>
      </g>

      <!-- LSC three-phase output rises and joins the same PCC bus as the DFIG stator. -->
      <g fill="none" stroke="#315f78" stroke-width="1.8">
        <path d="M474 42H500V-160"/>
        <path d="M474 56H512V-145"/>
        <path d="M474 70H524V-130"/>
      </g>
      <g fill="none" stroke="url(#fd-energy)" stroke-width="2.6" filter="url(#fd-glow)">
        <path class="fd-flow" d="M474 42H500V-160"/>
        <path class="fd-flow phase-b" d="M474 56H512V-145"/>
        <path class="fd-flow phase-c" d="M474 70H524V-130"/>
      </g>
      <g fill="#08798a"><circle cx="500" cy="-160" r="3.2"/><circle cx="512" cy="-145" r="3.2"/><circle cx="524" cy="-130" r="3.2"/></g>
      

      <!-- ESS converter is framed like the RSC and LSC; external L, C and battery remain visible. -->
      <g stroke-linecap="round" stroke-linejoin="round">
        <!-- Converter enclosure -->
        <rect x="175" y="136" width="100" height="106" rx="8" fill="rgba(255,255,255,.48)" stroke="#071b25" stroke-width="2"/>
        

        <!-- Positive and negative DC-bus terminals enter the converter frame -->
        <path d="M255 16V136H220M279 110V242H220" fill="none" stroke="#071b25" stroke-width="2"/>
        
        

        <!-- S1/D1 and S2/D2 inside the framed half-bridge -->
        <g transform="translate(210 145)"><use href="#fd-switch"/></g>
        <g transform="translate(210 193)"><use href="#fd-switch"/></g>
        <path d="M220 136V145M220 173V185M220 185V193M220 221V242M220 185H275" fill="none" stroke="#071b25" stroke-width="2"/>
        <circle cx="220" cy="185" r="3.2" fill="#071b25" stroke="none"/>
        
        
        
        

        <!-- External ESS inductor -->
        <path d="M275 185q6-12 12 0t12 0t12 0t12 0H340" fill="none" stroke="#071b25" stroke-width="2.2"/>
        

        <!-- External ESS capacitor -->
        <path d="M340 185H420M220 242H420M355 185V200M344 200H366M344 207H366M355 207V242" fill="none" stroke="#071b25" stroke-width="2"/>
        

        <!-- Battery icon matching the supplied reference: grey cap, orange body, plus, lightning and minus. -->
        <g transform="translate(395 172)">
          <rect x="5" y="0" width="9" height="5" rx="1" fill="#697177" stroke="#071b25" stroke-width="1"/>
          <rect x="36" y="0" width="9" height="5" rx="1" fill="#697177" stroke="#071b25" stroke-width="1"/>
          <rect x="0" y="5" width="50" height="56" rx="3" fill="#f28c28" stroke="#071b25" stroke-width="2"/>
          <path d="M0 18H50" stroke="#4f565b" stroke-width="13"/>
          <path class="battery-mark" d="M8 39h10M13 34v10M35 39h9" stroke="#ffffff" stroke-width="2.5"/>
          <path d="M28 28l-6 11h6l-4 11 11-14h-6l4-8z" fill="#ffffff" stroke="none"/>
        </g>
        <path d="M420 172V185M420 233V242" fill="none" stroke="#071b25" stroke-width="2"/>
        

        <!-- Animated transfer path ends at the converter boundary and resumes on the external ESS branch -->
        <path class="fd-flow" d="M255 16V136H220V185H420V172" fill="none" stroke="#007f8f" stroke-width="3.2"/>
      </g>
    </g>

    <g fill="#315f78" font-size="9" letter-spacing="1.35" opacity=".72"></g>
    </g>
  </svg>
